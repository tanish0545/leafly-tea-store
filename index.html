<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Favicon & Brand Site Icons (Google Search & Modern Browsers) -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/leafly-site-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leafly — Premium Indian Teas & Artisanal Rituals</title>
  <meta name="description"
    content="Discover rare single-origin Darjeeling loose leaf teas. Experience mindful brewing rituals, personalized tea sets, and exquisite luxury gifts." />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <link rel="canonical" href="https://leaflytea.in/" />
  <meta name="theme-color" content="#0b2b1e" />

  <!-- Early Preload for Critical Above-The-Fold Hero Image -->
  <link rel="preload" as="image" href="/leafly-hero-poster.webp" type="image/webp" fetchpriority="high" />

  <!-- Google Fonts: Inter (UI/Body) & Playfair Display (Serif/Display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
    rel="stylesheet" />

  <!-- Open Graph / Brand Metadata -->
  <meta property="og:title" content="Leafly — Single-Origin Indian Teas & Brewing Rituals" />
  <meta property="og:description"
    content="Artisanal loose-leaf teas from India's finest estates. Experience mindful brewing and bespoke gifting." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://leaflytea.in/" />
  <meta property="og:site_name" content="Leafly" />
  <meta property="og:image" content="https://leaflytea.in/leafly-site-icon.png" />
  <meta property="og:image:secure_url" content="https://leaflytea.in/leafly-site-icon.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta property="og:image:alt" content="Leafly Emblem Logo" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Leafly — Premium Single-Origin Indian Teas & Artisanal Rituals" />
  <meta name="twitter:description"
    content="Discover rare single-origin Darjeeling loose leaf teas. Experience mindful brewing rituals, personalized tea sets, and exquisite luxury gifts." />
  <meta name="twitter:image" content="https://leaflytea.in/leafly-site-icon.png" />

  <!-- Structured Data: Organization & WebSite for Google Search Identity -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://leaflytea.in/#organization",
        "name": "Leafly",
        "url": "https://leaflytea.in/",
        "logo": {
          "@type": "ImageObject",
          "@id": "https://leaflytea.in/#logo",
          "url": "https://leaflytea.in/leafly-site-icon.png",
          "contentUrl": "https://leaflytea.in/leafly-site-icon.png",
          "caption": "Leafly",
          "width": 512,
          "height": 512
        },
        "image": "https://leaflytea.in/leafly-site-icon.png",
        "description": "Curator of single-origin Indian teas, whole leaf Darjeeling harvests, artisan teaware, and mindful brewing rituals.",
        "email": "myleaflytea@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Near Balaji Symphony",
          "addressLocality": "Panvel",
          "postalCode": "410206",
          "addressRegion": "Maharashtra",
          "addressCountry": "IN"
        },
        "sameAs": [
          "https://www.instagram.com/leafly.greentea?igsi=MWI2dG5qenQyYjUxZA=="
        ]
      },
      {
        "@type": "WebSite",
        "@id": "https://leaflytea.in/#website",
        "url": "https://leaflytea.in/",
        "name": "Leafly",
        "description": "Premium Single-Origin Indian Teas & Artisanal Rituals",
        "publisher": {
          "@id": "https://leaflytea.in/#organization"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://leaflytea.in/shop?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    ]
  }
  </script>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
